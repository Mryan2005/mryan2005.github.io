name: Push to Baidu and Bing
on: 
    workflow_run: 
        workflows: ["Hexo CI"]
        types:
            - completed
    schedule:
        - cron: '0 0 * * *' # 每天格林尼治时间的 0:00 运行
jobs:
    build:
        runs-on: ubuntu-latest
        steps:
        - uses: actions/checkout@v4
        - name: switch to gh-pages
          run: |
            git fetch origin gh-pages:gh-pages
            git checkout gh-pages
        - uses: actions/setup-python@v2
          with:
            python-version: '3.x'
        - name: install dependencies
          run: |
            pip install requests
            pip install --upgrade certifi
        - name: push to baidu and Bing
          run: python3 ./pushToBaidu.py ${{secrets.SITEURL}} ${{secrets.BAIDUTOKEN}} ${{secrets.BINGTOKEN}}
        - name: Using IndexNew push
          run: python3 ./pushToBaidu.py ${{secrets.SITEURL}} indexNew ${{secrets.BINGINDEXNEWTOKEN}}
 
